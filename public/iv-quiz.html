<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Answer a few quick questions and see which IV on our menu to ask about. In-home IV and hydration therapy in Orange County with Christine Winnen, RN.">
<link rel="canonical" href="https://www.compoundoc.com/iv-quiz">
<meta property="og:type" content="website">
<meta property="og:title" content="Find Your IV — The Compound Wellness">
<meta property="og:description" content="A two-minute guide to the right IV or hydration drip to ask about. Delivered to your home in Orange County.">
<meta property="og:url" content="https://www.compoundoc.com/iv-quiz">
<meta property="og:image" content="https://www.compoundoc.com/coco-beach-session.webp">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FAF7F2;--parchment:#F0EAE0;--linen:#E8DDD0;--sand:#C4A882;--copper:#8A5E38;--cognac:#8A6040;--espresso:#2C2420;--body:#5E5248;--muted:#8C8077;--line:rgba(196,168,130,.4)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--espresso);font-family:'DM Sans',sans-serif;font-weight:300;font-size:16px;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
a{color:var(--copper)}
.top{padding:36px 24px 0;text-align:center}
.top a{display:inline-flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit}
.top svg{width:44px;height:44px;margin-bottom:10px}
.top .the{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--cognac);line-height:1}
.top .name{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.07em;line-height:1.15;margin-top:4px}
.top .well{font-size:8px;letter-spacing:.42em;text-transform:uppercase;color:var(--copper);line-height:1;margin-top:3px}
main{flex:1;width:100%;max-width:620px;margin:0 auto;padding:44px 24px 56px}
.step{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}html{scroll-behavior:auto}}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--copper);text-align:center;margin-bottom:14px}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:300;text-align:center;line-height:1.15;color:var(--espresso)}
h1{font-size:44px;margin-bottom:16px}
h2{font-size:32px;margin-bottom:26px}
h1 em,h2 em{font-style:italic;color:var(--copper)}
h1:focus,h2:focus{outline:none}
.lead{text-align:center;color:var(--body);max-width:480px;margin:0 auto 32px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--espresso);background:#fff;border:1px solid var(--line);padding:16px 20px;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--copper)}
.opt .t{display:block;font-size:16px;font-weight:400}
.opt .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
label.opt{display:flex;gap:14px;align-items:flex-start}
label.opt input{margin-top:5px;accent-color:var(--copper);width:17px;height:17px;flex:none}
label.opt:has(input:checked){background:var(--parchment);border-color:var(--copper)}
.btn{display:inline-block;font:inherit;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;text-align:center;border:1px solid var(--copper);background:var(--copper);color:var(--ivory);padding:16px 32px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--cognac);border-color:var(--cognac)}
.btn.ghost{background:transparent;color:var(--copper)}
.btn.ghost:hover{background:var(--parchment)}
.center{text-align:center;margin-top:28px}
.err{color:#8B2E2E;font-size:13px;text-align:center;min-height:20px;margin-top:12px}
.progress{display:flex;justify-content:center;gap:8px;margin-bottom:30px}
.progress i{width:34px;height:2px;background:var(--linen)}
.progress i.on{background:var(--copper)}
.back{display:block;margin:26px auto 0;background:none;border:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline}
.card{background:#fff;border:1px solid var(--line);padding:34px 30px;text-align:center}
.pill{display:inline-block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--copper);border:1px solid var(--line);padding:4px 12px;margin-bottom:14px}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:34px;line-height:1.15;margin-bottom:8px}
.card .why{color:var(--body);margin-bottom:16px}
.card .meta{font-size:13px;color:var(--muted);letter-spacing:.05em}
.card .price{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--copper);margin:6px 0 22px}
.also{text-align:center;margin-top:22px;color:var(--body);font-size:15px}
.also strong{font-weight:400;color:var(--espresso)}
.notice{background:var(--parchment);border:1px solid var(--line);padding:22px 24px;text-align:center;color:var(--body);margin-bottom:24px}
.adv{list-style:none;text-align:center;margin:0 0 6px}
.adv li{font-family:'Cormorant Garamond',serif;font-size:22px;padding:6px 0;color:var(--espresso)}
.fine{font-size:12px;color:var(--muted);line-height:1.65;text-align:center;margin-top:30px}
footer{border-top:1px solid var(--line);padding:26px 24px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <a href="/" aria-label="The Compound Wellness home">
    <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M 78,22 A 40,40 0 1,0 78,78" stroke="#C4A882" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="50" r="20" stroke="#C4A882" stroke-width="1.8"/><line x1="5" y1="50" x2="95" y2="50" stroke="#C4A882" stroke-width="1.1"/><line x1="50" y1="5" x2="50" y2="95" stroke="#C4A882" stroke-width="1.1"/><circle cx="50" cy="50" r="3.6" fill="#C4A882"/></svg>
    <span class="the">The</span><span class="name">Compound</span><span class="well">Wellness</span>
  </a>
</header>

<main id="app" aria-live="polite"><noscript><p class="lead">This quiz needs JavaScript. You can see the full IV menu at <a href="/practitioners/christine-winnen">compoundoc.com</a>.</p></noscript></main>

<footer>The Compound Wellness · 2801 W Coast Hwy STE 370, Newport Beach, CA · <a href="/privacy">Privacy</a></footer>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   EDIT HERE — everything the quiz says and recommends lives in this block.
   Have Christine review the matches before you advertise.
   ══════════════════════════════════════════════════════════════════════ */

// The IVs. Keep prices and times in sync with the IV menu and booking page.
// "id" must match the booking page service id (used for the Book button).
const IVS = {
  'iv-hydration-iv':        { name: 'Hydration IV',          cat: 'Hydration',          price: 320,  time: '40–70 min', why: 'A simple, hydrated reset.' },
  'iv-myers-cocktail-iv':   { name: 'Myers Cocktail IV',     cat: 'Hydration',          price: 380,  time: '40–70 min', why: 'Hydration with added vitamins.' },
  'iv-immune-support-iv':   { name: 'Immune Support IV',     cat: 'Immune Support',     price: 380,  time: '40–70 min', why: 'Everyday support for your immune system.' },
  'iv-super-immune-boost-iv': { name: 'Super Immune Boost IV', cat: 'Immune Support',   price: 490,  time: '40–70 min', why: 'A step up from the Immune Support IV.' },
  'iv-cold-flu-iv':         { name: 'Cold & Flu IV',         cat: 'Symptom Support',    price: 410,  time: '40–70 min', why: "For when you're feeling under the weather." },
  'iv-hangover-iv':         { name: 'Hangover IV',           cat: 'Symptom Support',    price: 380,  time: '40–70 min', why: 'For a rough morning after.' },
  'iv-jet-lag-iv':          { name: 'Jet Lag IV',            cat: 'Symptom Support',    price: 440,  time: '40–70 min', why: 'For after a long trip.' },
  'iv-migraine-relief-iv':  { name: 'Migraine Relief IV',    cat: 'Symptom Support',    price: 440,  time: '40–70 min', why: 'For days when migraines take over.' },
  'iv-all-inclusive-iv':    { name: 'All Inclusive IV',      cat: 'Everyday Wellness',  price: 490,  time: '40–70 min', why: 'A bit of everything in one visit.' },
  'iv-performance-iv':      { name: 'Performance IV',        cat: 'Everyday Wellness',  price: 440,  time: '40–70 min', why: 'For training, events, and recovery.' },
  'iv-radiance-iv':         { name: 'Radiance IV',           cat: 'Everyday Wellness',  price: 490,  time: '40–70 min', why: 'For a refreshed, glowing look.' },
  'iv-vitality-iv':         { name: 'Vitality IV',           cat: 'Everyday Wellness',  price: 490,  time: '40–70 min', why: 'For steady everyday energy.' },
};

// Question 1 — safety screen. Ticking any of the first three sends people to "talk to Christine first".
const SAFETY = {
  title: 'Before we begin',
  question: 'Does any of this apply to you?',
  options: [
    'I am pregnant or nursing',
    'I have a heart, kidney, or liver condition',
    'I take blood thinners or other daily prescription medication',
  ],
  noneLabel: 'None of these',
};

// Question 2 — the main goal. "follow" points to a key in FOLLOWUPS below.
const GOALS = {
  question: 'What are you hoping for?',
  options: [
    { label: 'Rehydrate and reset',            follow: 'hydrate' },
    { label: 'Support my immune system',       follow: 'immune' },
    { label: 'Bounce back from a rough patch', sub: 'A cold or flu, a hangover, travel, or a migraine', follow: 'situation' },
    { label: 'More energy, performance, or glow', follow: 'wellness' },
    { label: 'Something deeper',               sub: 'Iron, NAD+, or Niagen+', follow: 'advanced' },
  ],
};

// Question 3 — one follow-up per goal. "iv" = main suggestion, "alt" = second suggestion.
const FOLLOWUPS = {
  hydrate:   { question: 'What kind of reset are you after?', options: [
    { label: 'Simple hydration',        iv: 'iv-hydration-iv',      alt: 'iv-myers-cocktail-iv' },
    { label: 'Hydration plus vitamins', iv: 'iv-myers-cocktail-iv', alt: 'iv-hydration-iv' },
  ]},
  immune:    { question: 'How much support are you looking for?', options: [
    { label: 'Everyday support',  iv: 'iv-immune-support-iv',      alt: 'iv-super-immune-boost-iv' },
    { label: 'A stronger boost',  sub: 'Before travel, events, or busy seasons', iv: 'iv-super-immune-boost-iv', alt: 'iv-immune-support-iv' },
  ]},
  situation: { question: "What's going on?", options: [
    { label: 'A cold or the flu', iv: 'iv-cold-flu-iv',         alt: 'iv-immune-support-iv' },
    { label: 'A hangover',        iv: 'iv-hangover-iv',         alt: 'iv-hydration-iv' },
    { label: 'Jet lag or travel', iv: 'iv-jet-lag-iv',          alt: 'iv-hydration-iv' },
    { label: 'A migraine',        iv: 'iv-migraine-relief-iv',  alt: 'iv-hydration-iv' },
  ]},
  wellness:  { question: 'What do you want most?', options: [
    { label: 'Energy and vitality',               iv: 'iv-vitality-iv',      alt: 'iv-all-inclusive-iv' },
    { label: 'Athletic performance and recovery', iv: 'iv-performance-iv',   alt: 'iv-vitality-iv' },
    { label: 'A refreshed glow',                  iv: 'iv-radiance-iv',      alt: 'iv-all-inclusive-iv' },
    { label: 'A little of everything',            iv: 'iv-all-inclusive-iv', alt: 'iv-vitality-iv' },
  ]},
};

// Advanced infusions are never recommended by the quiz — people are sent to Christine.
const ADVANCED = ['Iron IV', 'NAD+ IV', 'Niagen+ IV'];

const BOOK_URL  = '/booking.html?prac=christine';   // opens booking with Christine selected
const MENU_URL  = '/practitioners/christine-winnen'; // her page with the full IV menu
const TALK_URL  = '/booking.html?prac=christine';

/* ══════════════════════ end of editable block ═════════════════════════ */

const app = document.getElementById('app');
const money = n => '$' + n.toLocaleString('en-US');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const trail = [];              // for the Back button
let state = { screen: 'intro', goal: null };

function go(screen, extra) {
  trail.push({ ...state });
  state = { ...state, screen, ...extra };
  render();
}
function back() { state = trail.pop() || { screen: 'intro' }; render(); }

function progress(n) {
  return `<div class="progress" aria-hidden="true">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
}
function backBtn() { return trail.length ? `<button class="back" type="button" onclick="back()">Back</button>` : ''; }

function render() {
  const s = state.screen;
  let html = '';
  if (s === 'intro') {
    html = `<section class="step">
      <p class="eyebrow">IV &amp; Hydration</p>
      <h1 tabindex="-1">Find your <em>IV.</em></h1>
      <p class="lead">Answer a few quick questions and see which IV on our menu to ask about. It takes about two minutes, and nothing you choose is saved.</p>
      <div class="center" style="margin-top:0"><button class="btn" type="button" onclick="go('safety')">Start</button></div>
      <p class="fine">In-home IV and hydration therapy in Orange County, delivered by Christine Winnen, RN.</p>
    </section>`;
  } else if (s === 'safety') {
    html = `<section class="step">${progress(1)}
      <p class="eyebrow">${esc(SAFETY.title)}</p>
      <h2 tabindex="-1">${esc(SAFETY.question)}</h2>
      <form id="safetyForm" class="opts" onsubmit="return submitSafety(event)">
        ${SAFETY.options.map((o, i) => `<label class="opt"><input type="checkbox" name="risk" value="${i}" onchange="clearNone()"><span class="t">${esc(o)}</span></label>`).join('')}
        <label class="opt"><input type="checkbox" id="noneBox" onchange="clearRisks()"><span class="t">${esc(SAFETY.noneLabel)}</span></label>
        <div class="err" id="err" role="alert"></div>
        <div class="center" style="margin-top:6px"><button class="btn" type="submit">Continue</button></div>
      </form>${backBtn()}</section>`;
  } else if (s === 'goal') {
    html = `<section class="step">${progress(2)}
      <p class="eyebrow">Your goal</p>
      <h2 tabindex="-1">${esc(GOALS.question)}</h2>
      <div class="opts">${GOALS.options.map((o, i) => `<button class="opt" type="button" onclick="pickGoal(${i})"><span class="t">${esc(o.label)}</span>${o.sub ? `<span class="s">${esc(o.sub)}</span>` : ''}</button>`).join('')}</div>
      ${backBtn()}</section>`;
  } else if (s === 'follow') {
    const f = FOLLOWUPS[state.goal];
    html = `<section class="step">${progress(3)}
      <p class="eyebrow">One more</p>
      <h2 tabindex="-1">${esc(f.question)}</h2>
      <div class="opts">${f.options.map((o, i) => `<button class="opt" type="button" onclick="pickFollow(${i})"><span class="t">${esc(o.label)}</span>${o.sub ? `<span class="s">${esc(o.sub)}</span>` : ''}</button>`).join('')}</div>
      ${backBtn()}</section>`;
  } else if (s === 'talk') {
    html = `<section class="step">
      <p class="eyebrow">Let's talk first</p>
      <h2 tabindex="-1">Please check with <em>Christine.</em></h2>
      <div class="notice">Based on what you shared, an IV is something to talk through with Christine Winnen, RN, before booking. She can review your health and medications and recommend what is appropriate for you.</div>
      <div class="center" style="margin-top:0"><a class="btn" href="${TALK_URL}">Request a visit with Christine</a></div>
      <div class="center" style="margin-top:14px"><button class="btn ghost" type="button" onclick="restart()">Start over</button></div>
      ${disclaimer()}</section>`;
  } else if (s === 'advanced') {
    html = `<section class="step">
      <p class="eyebrow">Advanced infusions</p>
      <h2 tabindex="-1">These are chosen <em>with Christine.</em></h2>
      <div class="notice">Advanced infusions are matched to you after a conversation, not a quiz.</div>
      <ul class="adv">${ADVANCED.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
      <div class="center"><a class="btn" href="${BOOK_URL}">Book with Christine</a></div>
      <div class="center" style="margin-top:14px"><a class="btn ghost" href="${MENU_URL}">See the full menu</a></div>
      <div class="center" style="margin-top:10px"><button class="back" type="button" onclick="restart()">Start over</button></div>
      ${disclaimer()}</section>`;
  } else if (s === 'result') {
    const iv = IVS[state.iv], alt = state.alt && IVS[state.alt];
    html = `<section class="step">
      <p class="eyebrow">Your result</p>
      <h2 tabindex="-1">You might ask about the <em>${esc(iv.name)}.</em></h2>
      <div class="card">
        <span class="pill">${esc(iv.cat)}</span>
        <h3>${esc(iv.name)}</h3>
        <p class="why">${esc(iv.why)}</p>
        <p class="price">${money(iv.price)}</p>
        <p class="meta">About ${esc(iv.time)} including setup</p>
        <div class="center" style="margin-top:24px"><a class="btn" href="${BOOK_URL}&svc=${encodeURIComponent(state.iv)}">Book this IV</a></div>
      </div>
      ${alt ? `<p class="also">You could also ask about the <strong>${esc(alt.name)}</strong> (${money(alt.price)}).</p>` : ''}
      <div class="center"><a class="btn ghost" href="${MENU_URL}">See the full IV menu</a></div>
      <div class="center" style="margin-top:6px"><button class="back" type="button" onclick="restart()">Start over</button></div>
      ${disclaimer()}</section>`;
  }
  app.innerHTML = html;
  const h = app.querySelector('h1,h2'); if (h) h.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function disclaimer() {
  return `<p class="fine">These are general suggestions to discuss with Christine Winnen, RN. They are not medical advice, and your treatment is chosen after a clinical assessment. Nothing you chose here is saved or sent. In an emergency, call 911.</p>`;
}

function clearNone() { document.getElementById('noneBox').checked = false; }
function clearRisks() { document.querySelectorAll('input[name=risk]').forEach(c => c.checked = false); }
function submitSafety(e) {
  e.preventDefault();
  const risks = [...document.querySelectorAll('input[name=risk]:checked')].length;
  const none = document.getElementById('noneBox').checked;
  if (!risks && !none) { document.getElementById('err').textContent = 'Choose at least one option to continue.'; return false; }
  go(risks ? 'talk' : 'goal');
  return false;
}
function pickGoal(i) {
  const g = GOALS.options[i];
  if (g.follow === 'advanced') return go('advanced');
  go('follow', { goal: g.follow });
}
function pickFollow(i) {
  const o = FOLLOWUPS[state.goal].options[i];
  go('result', { iv: o.iv, alt: o.alt });
}
function restart() { trail.length = 0; state = { screen: 'intro', goal: null }; render(); }

render();
</script>
</body>
</html>
